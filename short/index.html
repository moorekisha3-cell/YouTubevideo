<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b7a78;
        --ink: #ffffff;
        --font-display: "Oswald", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="split"
        class="clip"
        data-composition-id="split"
        data-composition-src="compositions/split.html"
        data-start="0"
        data-duration="22.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="roth"
        class="clip"
        data-composition-id="roth"
        data-composition-src="compositions/roth.html"
        data-start="22.4"
        data-duration="8.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="30.7"
        data-duration="5.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="captions"
        class="clip"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="36"
        data-track-index="2"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 10"
      ></div>

      <!-- Narration: free local Kokoro voice af_heart (scripts/make_narration.py); it is the clock for every scene -->
      <audio id="narration" class="clip" src="assets/voice/narration.wav" data-start="0" data-duration="34.39" data-track-index="3" data-volume="1"></audio>

      <!-- Sound effects under the voice: each starts so its peak lands one frame after its picture -->
      <audio id="sfx-age-pop" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="13.21" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-tax-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-duration="2.12" data-start="16.86" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-zero-ping" class="clip" src="assets/sfx/ping.mp3" data-duration="1.32" data-start="18.41" data-track-index="4" data-volume="0.4"></audio>
      <audio id="sfx-flood-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-duration="0.57" data-start="21.27" data-track-index="6" data-volume="0.4"></audio>
      <audio id="sfx-coin-1" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="25.81" data-track-index="4" data-volume="0.35"></audio>
      <audio id="sfx-coin-2" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="27.71" data-track-index="4" data-volume="0.3"></audio>
      <audio id="sfx-coin-3" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="28.31" data-track-index="7" data-volume="0.35"></audio>
      <audio id="sfx-mark-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-duration="2.59" data-start="29.15" data-track-index="5" data-volume="0.45"></audio>
      <audio id="sfx-shrink-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-duration="0.57" data-start="30.15" data-track-index="6" data-volume="0.3"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
