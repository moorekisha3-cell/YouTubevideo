<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b7a78;
        --ink: #ffffff;
        --font-display: "Oswald", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32.9"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="split"
        class="clip"
        data-composition-id="split"
        data-composition-src="compositions/split.html"
        data-start="0"
        data-duration="20.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="roth"
        class="clip"
        data-composition-id="roth"
        data-composition-src="compositions/roth.html"
        data-start="20.4"
        data-duration="8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="endcard"
        class="clip"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="28.4"
        data-duration="4.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Sound effects: each starts so its peak lands one frame after its picture -->
      <audio id="sfx-age-pop" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="9.21" data-track-index="2" data-volume="0.5"></audio>
      <audio id="sfx-tax-impact" class="clip" src="assets/sfx/impact-bass-1.mp3" data-duration="2.12" data-start="11.76" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-zero-ping" class="clip" src="assets/sfx/ping.mp3" data-duration="1.32" data-start="15.01" data-track-index="2" data-volume="0.6"></audio>
      <audio id="sfx-flood-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-duration="0.57" data-start="18.77" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-coin-1" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="22.66" data-track-index="2" data-volume="0.55"></audio>
      <audio id="sfx-coin-2" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="25.16" data-track-index="2" data-volume="0.5"></audio>
      <audio id="sfx-coin-3" class="clip" src="assets/sfx/pop.mp3" data-duration="0.72" data-start="25.76" data-track-index="5" data-volume="0.6"></audio>
      <audio id="sfx-mark-impact" class="clip" src="assets/sfx/impact-bass-2.mp3" data-duration="2.59" data-start="26.85" data-track-index="3" data-volume="0.7"></audio>
      <audio id="sfx-shrink-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-duration="0.57" data-start="27.89" data-track-index="4" data-volume="0.45"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
