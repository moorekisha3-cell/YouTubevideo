  <script>
    const lvl = (f) => 386 - 316 * f;
    const tl = gsap.timeline({ paused: true });

    const blurIn = (sel, at, d = 0.18) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: d, ease: "power4.out" }, at);
    const blurOut = (sel, at, d = 0.18) =>
      tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: d, ease: "power2.in" }, at);

    // Header lands word by word
    tl.fromTo("#roth-header span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.067, ease: "power4.out" }, 0.15);

    // Coins fall into the slot (slot top at chute bottom, y=417); each lands then the level rises
    const drop = (id, land, to) => {
      tl.fromTo(id, { y: -520 }, { y: 120, duration: 0.5, ease: "power2.in" }, land - 0.5);
      tl.to("#roth-level", { attr: { y: lvl(to) }, duration: 0.45, ease: "expo.out" }, land + 0.05);
    };

    blurIn("#roth-line-a", 1.6);
    drop("#roth-coin-1", 2.35, 0.84);

    blurOut("#roth-line-a", 4.0, 0.15);
    tl.fromTo("#roth-line-b", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 4.15);
    drop("#roth-coin-2", 4.85, 0.89);
    drop("#roth-coin-3", 5.45, 0.94);
    blurIn("#roth-quiet", 4.6);

    // Exit: words blur out, the jar shrinks into the end-card icon (465,420 at 1/3x)
    blurOut(["#roth-header", "#roth-line-b", "#roth-quiet"], 7.15, 0.2);
    tl.to("#roth-jar", { x: 150, y: 40, scale: 1 / 3, transformOrigin: "0% 0%", duration: 0.75, ease: "power3.inOut" }, 7.25);

    window.__timelines["roth"] = tl;
  </script>
