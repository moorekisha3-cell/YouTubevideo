    // Timed to the narration (assets/voice/narration.wav). Captions carry the words.

    tl.to("#split-dim-bottom", { opacity: 0, duration: 0.3, ease: "power2.inOut" }, 7.7);
    tl.fromTo("#split-dim-top", { opacity: 0 }, { opacity: 0.35, duration: 0.3, ease: "power2.inOut" }, 7.7);

      v: 59.5,
      duration: 2.7,
      ease: "power2.inOut",
      onUpdate: () => {
        const el = document.querySelector("#split-age");
        el.textContent = age.v >= 59.5 ? "Age 59½" : "Age " + Math.floor(age.v);

    }, 10.6);
    tl.fromTo(["#split-trad-level", "#split-roth-level"], { attr: { y: lvl(0.3) } }, { attr: { y: lvl(0.8) }, duration: 2.7, ease: "power2.inOut" }, 10.6);
