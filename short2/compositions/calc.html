<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #0f4c3a;
      color: #f4f1e8;
      font-family: "Inter", sans-serif;
    }
    .calc-lbl {
      position: absolute;
      left: 110px;

    .calc-big {
      position: absolute;

      font-size: 140px;
      line-height: 1;
      white-space: nowrap;
    }
    .calc-op {
      position: absolute;
      left: 110px;
      top: 690px;
      font-family: "Oswald", sans-serif;
      font-weight: 600;
      font-size: 110px;
      line-height: 1;
      white-space: nowrap;
      opacity: 0;
    }
    .calc-note {
      position: absolute;
      left: 400px;
      top: 728px;
      font-size: 40px;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0;
    }
    .calc-a-lbl { top: 440px; }
    .calc-r-lbl { top: 1020px; }
    #calc-a { top: 490px; }
    #calc-r { top: 860px; color: #f2c14e; }
    #calc-a-word { top: 490px; opacity: 0; }
    #calc-r-word { top: 860px; color: #f2c14e; opacity: 0; }
    #calc-ul {
      position: absolute;
      left: 110px;
      top: 642px;
      width: 380px;
      height: 8px;
      background: #f4f1e8;
    }
    #calc-rule {
      position: absolute;
      left: 110px;
      top: 830px;
      width: 820px;
      height: 6px;
      background: #f4f1e8;
    }
    .calc-on { opacity: 1; }
  </style>
  <div id="root" data-composition-id="calc" data-width="1080" data-height="1920">
    <div id="calc-al-spend" class="calc-lbl calc-a-lbl calc-on">You spend each year</div>
    <div id="calc-al-saved" class="calc-lbl calc-a-lbl">You've saved</div>
    <div id="calc-al-goal" class="calc-lbl calc-a-lbl">Your goal</div>
    <div id="calc-al-left" class="calc-lbl calc-a-lbl">Left to cover</div>
    <div id="calc-a" class="calc-big">$40,000</div>
    <div id="calc-a-word" class="calc-big">Your spending</div>
    <div id="calc-ul"></div>

    <div id="calc-op-25" class="calc-op calc-on">&times; 25</div>
    <div id="calc-op-4" class="calc-op">&times; 4%</div>
    <div id="calc-op-ss" class="calc-op">&minus; $20,000</div>
    <div id="calc-n-div" class="calc-note">same as 100 &divide; 4</div>
    <div id="calc-n-rule" class="calc-note">the 4% Rule, flipped</div>
    <div id="calc-n-ss" class="calc-note" style="left: 640px">Social Security</div>
    <div id="calc-rule"></div>

    <div id="calc-r" class="calc-big">?</div>
    <div id="calc-r-word" class="calc-big">Your number</div>
    <div id="calc-rl-number" class="calc-lbl calc-r-lbl calc-on">Your number</div>
    <div id="calc-rl-year1" class="calc-lbl calc-r-lbl">Withdraw in year one</div>
    <div id="calc-rl-30" class="calc-lbl calc-r-lbl">Inflation-adjusted, for about 30 years</div>
  </div>
  <script>
    // Timed to the narration (assets/voice/words.json); numbers from script_video3.md.
    const SCENE = 38.7;
    const tl = gsap.timeline({ paused: true });

    const show = (sel, at) =>
      tl.to(sel, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, at);
    const hide = (sel, at) =>
      tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, at);
    tl.set(".calc-lbl:not(.calc-on), .calc-op:not(.calc-on), .calc-note", { filter: "blur(8px)" }, 0);

    // Each row's value as rolls [start, end, value]; null shows "?". A roll eases out like an odometer.
    const A = { from: 40000, rolls: [[13.75, 14.45, 1000000], [21.25, 21.85, 30000], [25.05, 25.65, 60000], [31.1, 31.7, 50000], [32.9, 33.5, 30000]] };
    const R = { from: null, rolls: [[7.65, 8.5, 1000000], [14.2, 14.2, null], [16.95, 17.7, 40000], [22.95, 23.7, 750000], [25.9, 26.6, 1500000], [29.6, 29.6, null], [33.5, 34.2, 750000]] };
    const ease = gsap.parseEase("expo.out");
    const valueAt = (row, t) => {
      let v = row.from;
      for (const [s, e, to] of row.rolls) {
        if (t < s) break;
        if (to === null || t >= e) { v = to; continue; }
        const from = v === null ? 0 : v;
        return from + (to - from) * ease((t - s) / (e - s));
      }
      return v;
    };
    const money = (v) => (v === null ? "?" : "$" + (Math.round(v / 1000) * 1000).toLocaleString("en-US"));
    const elA = document.querySelector("#calc-a");
    const elR = document.querySelector("#calc-r");
    const drv = { p: 0 };
    tl.to(drv, {
      p: 1,
      duration: SCENE,
      ease: "none",
      onUpdate: () => {
        const t = drv.p * SCENE;
        elA.textContent = money(valueAt(A, t));
        elR.textContent = money(valueAt(R, t));
      },
    }, 0);

    // "$40,000" (4.3 s) is underlined; "Multiply it by 25" (5.8 s) punches the operator
    tl.fromTo("#calc-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out", transformOrigin: "0% 50%" }, 4.3);
    tl.fromTo("#calc-op-25", { scale: 1.18 }, { scale: 1, duration: 0.4, ease: "expo.out", transformOrigin: "0% 50%" }, 5.8);

    // "Why 25? It's the flip side of the 4% Rule" (10.2-13.5 s)
    show("#calc-n-div", 10.4);
    hide("#calc-n-div", 12.2);
    show("#calc-n-rule", 12.4);

    // The flip (13.75 s): saved $1,000,000 x 4% = $40,000 a year
    hide(["#calc-al-spend", "#calc-ul", "#calc-n-rule", "#calc-op-25"], 13.6);
    show("#calc-al-saved", 13.8);
    show("#calc-op-4", 14.25);
    hide("#calc-rl-number", 16.8);
    show("#calc-rl-year1", 16.95);
    hide("#calc-rl-year1", 19.3);
    show("#calc-rl-30", 19.45);

    // "Want $30,000 a year?" (21.2 s) and "Want $60,000?" (25.05 s): back to x 25
    hide(["#calc-al-saved", "#calc-op-4", "#calc-rl-30"], 21.05);
    show(["#calc-al-spend", "#calc-op-25", "#calc-rl-number"], 21.25);

    // "And Social Security counts" (27.8 s): goal $50,000 - $20,000 = $30,000 x 25 = $750,000
    hide("#calc-al-spend", 27.85);
    show("#calc-al-goal", 28.0);
    hide("#calc-op-25", 29.95);
    show(["#calc-op-ss", "#calc-n-ss"], 30.1);
    hide(["#calc-al-goal", "#calc-op-ss", "#calc-n-ss"], 32.75);
    show(["#calc-al-left", "#calc-op-25"], 32.9);

    // "Your spending, times 25. That's your number." (35.7 s): the formula in words
    hide(["#calc-al-left", "#calc-a", "#calc-rl-number"], 35.55);
    show("#calc-a-word", 35.75);
    hide("#calc-r", 37.55);
    show("#calc-r-word", 37.75);

    window.__timelines["calc"] = tl;
  </script>
</template>
