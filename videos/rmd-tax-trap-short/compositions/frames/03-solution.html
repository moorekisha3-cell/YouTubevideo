<div id="root" data-composition-id="03-solution" data-width="1080" data-height="1920" data-duration="10.5">
  <div id="s03solution-bg" class="clip" data-start="0" data-duration="10.5" data-track-index="0"></div>

  <div id="s03solution-card" class="clip" data-start="0" data-duration="10.5" data-track-index="1">
    <div class="s03solution-swap">
      <div id="s03solution-goodnews" class="s03solution-swap-layer">The good news?</div>
      <div id="s03solution-headline" class="s03solution-swap-layer">This is avoidable.</div>
    </div>

    <div id="s03solution-accentline"></div>

    <div class="s03solution-tags">
      <div id="s03solution-tag1" class="s03solution-tag">Roth conversions</div>

      <span id="s03solution-subline-text"></span><span id="s03solution-subline-cursor">|</span>
    </div>
  </div>

<script>
  (function () {
    var goodnews = document.getElementById("s03solution-goodnews");
    var headline = document.getElementById("s03solution-headline");
    var accentline = document.getElementById("s03solution-accentline");
    var tag1 = document.getElementById("s03solution-tag1");
    var tag2 = document.getElementById("s03solution-tag2");
    var card = document.getElementById("s03solution-card");
    var sublineTextEl = document.getElementById("s03solution-subline-text");
    var cursorEl = document.getElementById("s03solution-subline-cursor");

    // Baseline hidden/pre-entrance states (JS-driven, never CSS-hidden).
    gsap.set(goodnews, { y: 40, opacity: 0 });
    gsap.set(headline, { clipPath: "inset(0% 0% 100% 0%)", opacity: 0 });
    gsap.set(accentline, { scaleX: 0, opacity: 0, transformOrigin: "50% 50%" });
    gsap.set([tag1, tag2], { y: 26, opacity: 0 });
    sublineTextEl.textContent = "";

    var tl = gsap.timeline({ paused: true });

    // Scene 1 (0.0-3.0s): "The good news?" slides up and settles; accent line
    // enters cobalt, then turns positive-green ahead of the reveal.
    tl.to(accentline, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.3);
    tl.to(goodnews, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.35);
    tl.to(accentline, { backgroundColor: "#059669", duration: 0.6, ease: "power2.inOut" }, 2.5);

    // Scene 2 (3.0-6.5s): the good-news line clears and a clip-path wipe
    // reveals the card headline; supporting strategy tags fade in staggered.
    tl.to(goodnews, { y: -28, opacity: 0, duration: 0.35, ease: "power2.in" }, 2.75);
    tl.to(headline, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 0.7, ease: "power2.inOut" }, 2.95);
    tl.to(tag1, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.0);
    tl.to(tag2, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.4);

    // Scene 3 (6.5-10.0s): sub-line types in beneath the tags, then the full
    // card holds still — one subtle breath is the only live element left.
    var fullSubline = "Done early, this can help you keep more of what you saved.";
    var typeDriver = { v: 0 };
    tl.to(
      typeDriver,
      {
        v: fullSubline.length,
        duration: 2.2,
        ease: "power1.inOut",
        onUpdate: function () {
          sublineTextEl.textContent = fullSubline.substring(0, Math.floor(typeDriver.v));
        },
      },
      6.6,
    );

    var blinkPhase = { p: 0 };
    tl.to(
      blinkPhase,
      {
        p: Math.PI * 2 * 4.4,
        duration: 3.4,
        ease: "none",
        onUpdate: function () {
          cursorEl.style.opacity = Math.sin(blinkPhase.p) > 0 ? "1" : "0";
        },
      },
      6.6,
    );

    tl.to(card, { scale: 1.01, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.7);

    window.__timelines = window.__timelines || {};
    window.__timelines["03-solution"] = tl;
  })();
</script>
