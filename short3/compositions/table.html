    // Timed to the narration (assets/voice/words.json); numbers from script_video7.md.
    const SCENE = 30.2;
    const tl = gsap.timeline({ paused: true });
    const show = (sel, at) =>
      tl.fromTo(sel, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, at);
    const hide = (sel, at) =>
      tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" }, at);

    // The value under the stack, as rolls [start, end, value, ease]
    const ROLLS = [[9.0, 9.7, 10400, "expo.out"], [13.95, 14.5, 10816, "expo.out"], [15.0, 19.45, 21911, "compound"],
                   [24.3, 24.3, 0, "none"], [24.35, 25.0, 150000, "expo.out"]];
    const valueAt = (t) => {
      let v = 10000;
      for (const [s, e, to, ease] of ROLLS) {
        if (t < s) break;
        if (t >= e) { v = to; continue; }
        // the 20-year time-lapse compounds for real: $10,000 x 1.04^year, year 2 to 20
        if (ease === "compound") return 10000 * Math.pow(1.04, 2 + 18 * ((t - s) / (e - s)));
        return v + (to - v) * gsap.parseEase(ease)((t - s) / (e - s));
      }
      return v;
    };
    const elVal = document.querySelector("#tbl-val");
    const elYear = document.querySelector("#tbl-lbl-year");
    const drv = { p: 0 };
    tl.to(drv, {
      p: 1,
      duration: SCENE,
      ease: "none",
      onUpdate: () => {
        const t = drv.p * SCENE;
        elVal.textContent = "$" + Math.round(valueAt(t)).toLocaleString("en-US");
        const k = Math.min(1, Math.max(0, (t - 15.0) / 4.45));
        elYear.textContent = "Year " + (2 + Math.floor(18 * k));
      },
    }, 0);

    const addBill = (n, at) =>

      if (bill) addBill(bill, land);
    };

    // "yielding 4%" (4.7 s)

    // "Year one, it pays you $400" (6.7 s): a coin pops out of the stack

    tl.to("#tbl-coin-a", { opacity: 0, duration: 0.06 }, 8.5);
    addBill(7, 8.5);

    // "Next year's payout? $416." (13.07 s)

    tl.to("#tbl-coin-b", { opacity: 0, duration: 0.06 }, 14.0);
    addBill(8, 14.0);

    // "Keep reinvesting for 20 years" (14.5-20.5 s): years tick, coins pour in, $21,911
    hide("#tbl-lbl-yield", 14.6);
    show("#tbl-lbl-year", 14.8);
    drop(1, 15.4, 177, 9);
    drop(2, 16.3, 161, 10);
    drop(3, 17.2, 145, 11);
    drop(4, 18.1, 129, 12);
    show("#tbl-lbl-illus", 15.0);

    // "Want $500 a month?" (20.76 s): the stack lifts away, a month card lands
    hide(["#tbl-val", "#tbl-lbl-year", "#tbl-lbl-illus"], 20.5);
    tl.to("#tbl-stack", { y: -1000, duration: 0.4, ease: "power3.in" }, 20.45);
    tl.fromTo("#tbl-cal", { opacity: 1, y: 1600 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 20.75);
    show("#tbl-cal-year", 22.3);
    // "about $150,000 invested" (24.9 s)
    tl.fromTo("#tbl-val", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out", immediateRender: false }, 24.3);
    show("#tbl-lbl-inv", 25.0);

    // "Start small. Reinvest. Let it compound." (27.2 s): the stack comes back and keeps taking coins
    hide(["#tbl-val", "#tbl-lbl-inv"], 26.95);
    tl.to("#tbl-cal", { y: 1600, duration: 0.35, ease: "power3.in" }, 26.95);
